name: Property Check pricing client

on:
  pull_request:
    branches: [main]
    paths:
      - "site/pricing-*.js"
      - "site/pricing-*.css"
      - "site/tests/pricing-client-smoke.mjs"
      - "services/pricing-gateway/**"
      - ".github/workflows/property-check-pricing-client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-check-pricing-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  automated-pricing-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use preinstalled Chrome
        run: |
          which google-chrome
          google-chrome --version
          npm init -y
          npm install --no-save playwright-core@1.55.0

      - name: Start deterministic pricing gateway
        run: |
          cd services/pricing-gateway
          PRICING_PROVIDER=fixture PORT=8787 ALLOWED_ORIGINS=http://127.0.0.1:8001 node src/server.mjs > /tmp/pricing-gateway.log 2>&1 &
          echo $! > /tmp/pricing-gateway.pid
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:8787/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pricing-gateway.log
          exit 1

      - name: Build pricing-integrated static site
        run: |
          rm -rf .pricing-site
          mkdir -p .pricing-site
          {
            cat site/index.parts/part-0[0-4].b64.part
            cat site/index.parts/part-05.fragments/*.b64.part
            cat site/index.parts/part-06.b64.part
          } | tr -d '\n\r' | base64 -d | gunzip > .pricing-site/index.html
          cat site/live-property.parts/*.js.part > .pricing-site/live-property.js
          python3 site/patch-live-search.py .pricing-site/live-property.js
          echo "cc3561dda4bda26473747f7f90a47f6145dd196166b6e8ff9442d0a0ab118faa  .pricing-site/index.html" | sha256sum -c -
          echo "2f2f5b3150023412efa8c7b957090700b6d12b74ec81c6b252257a817d19afad  .pricing-site/live-property.js" | sha256sum -c -
          cp site/favicon.svg site/enhancements.js site/enhancements.css site/map-initial-state.js \
            site/decision-layer-guard.js site/decision-layer.js site/decision-layer.css \
            site/decision-governance.js site/decision-governance.css \
            site/pricing-config.js site/pricing-layer.js site/pricing-layer.css \
            site/shortlist.js site/shortlist.css .pricing-site/
          printf 'window.LEMONCHECK_PRICING_API_BASE = "http://127.0.0.1:8787";\n' > .pricing-site/pricing-config.js
          node --check .pricing-site/pricing-layer.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.pricing-site/index.html')
          s = p.read_text(encoding='utf-8')
          head = '''  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
            <link rel="stylesheet" href="./enhancements.css">
            <link rel="stylesheet" href="./decision-layer.css">
            <link rel="stylesheet" href="./decision-governance.css">
            <link rel="stylesheet" href="./pricing-layer.css">
            <link rel="stylesheet" href="./shortlist.css">'''
          scripts = '''  <script src="./enhancements.js"></script>
            <script src="./map-initial-state.js"></script>
            <script src="./decision-layer-guard.js"></script>
            <script src="./decision-layer.js"></script>
            <script src="./decision-governance.js"></script>
            <script src="./pricing-config.js"></script>
            <script src="./pricing-layer.js"></script>
            <script src="./shortlist.js"></script>'''
          s = s.replace('</head>', f'{head}\n</head>', 1)
          s = s.replace('</body>', f'{scripts}\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'src="./pricing-layer.js"' .pricing-site/index.html
          grep -Fq 'href="./pricing-layer.css"' .pricing-site/index.html
          grep -Fq 'LC-PRICE-CLIENT-v0.1.0' .pricing-site/pricing-layer.js

      - name: Start pricing-integrated site
        run: |
          python3 -m http.server 8001 --directory .pricing-site > /tmp/pricing-site.log 2>&1 &
          echo $! > /tmp/pricing-site.pid
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:8001/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pricing-site.log
          exit 1

      - name: Verify automated pricing in browser
        env:
          PROPERTY_CHECK_BASE_URL: http://127.0.0.1:8001/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/pricing-client-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/pricing-client-smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-check-pricing-client-evidence
          path: site/tests/pricing-client-artifacts
          if-no-files-found: ignore
