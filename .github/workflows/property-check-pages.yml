name: Deploy Property Check live beta

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/property-check-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: property-check-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and verify live static site
        run: |
          rm -rf .pages-site
          mkdir -p .pages-site
          {
            cat site/index.parts/part-0[0-4].b64.part
            cat site/index.parts/part-05.fragments/*.b64.part
            cat site/index.parts/part-06.b64.part
          } | tr -d '\n\r' | base64 -d | gunzip > .pages-site/index.html
          cat site/live-property.parts/*.js.part > .pages-site/live-property.js
          python3 site/patch-live-search.py .pages-site/live-property.js
          echo "cc3561dda4bda26473747f7f90a47f6145dd196166b6e8ff9442d0a0ab118faa  .pages-site/index.html" | sha256sum -c -
          echo "2f2f5b3150023412efa8c7b957090700b6d12b74ec81c6b252257a817d19afad  .pages-site/live-property.js" | sha256sum -c -
          node --check .pages-site/live-property.js
          grep -Fq '<script src="./live-property.js"></script>' .pages-site/index.html
          cp site/favicon.svg .pages-site/favicon.svg
          python3 -c "from pathlib import Path; p=Path('.pages-site/index.html'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('</head>', '  <link rel=\"icon\" type=\"image/svg+xml\" href=\"./favicon.svg\">\\n</head>', 1), encoding='utf-8')"
          grep -Fq 'href="./favicon.svg"' .pages-site/index.html
          touch .pages-site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-site:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use preinstalled Chrome
        run: |
          which google-chrome
          google-chrome --version
          npm init -y
          npm install --no-save playwright-core@1.55.0

      - name: Wait for deployed site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for i in {1..60}; do
            curl --fail --silent --location "$SITE_URL" >/dev/null && exit 0
            sleep 2
          done
          echo "Deployed site did not become reachable: $SITE_URL"
          exit 1

      - name: Verify deployed site and live official sources
        env:
          PROPERTY_CHECK_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/deployed-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/live-smoke.mjs

      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-check-deployed-browser-evidence
          path: site/tests/deployed-artifacts
          if-no-files-found: ignore
