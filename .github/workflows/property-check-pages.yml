name: Deploy Property Check live beta

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/property-check-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: property-check-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build simplified static site
        run: |
          python3 site/build-static.py .pages-site
          grep -Fq 'LC-UX-v0.1.0' .pages-site/ux-simplification.js
          grep -Fq 'src="./ux-simplification.js"' .pages-site/index.html
          grep -Fq 'href="./ux-simplification.css"' .pages-site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-site:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use preinstalled Chrome
        run: |
          which google-chrome
          google-chrome --version
          npm init -y
          npm install --no-save playwright-core@1.55.0

      - name: Wait for simplified UX deployment
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for i in {1..90}; do
            if curl --fail --silent --location "$SITE_URL/ux-simplification.js" | grep -Fq 'LC-UX-v0.1.0'; then
              exit 0
            fi
            sleep 2
          done
          echo "Simplified UX did not become reachable: $SITE_URL"
          exit 1

      - name: Verify deployed live report
        env:
          PROPERTY_CHECK_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/deployed-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/live-smoke.mjs

      - name: Verify deployed comparison
        env:
          PROPERTY_CHECK_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/deployed-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/comparison-smoke.mjs

      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-check-deployed-browser-evidence
          path: site/tests/deployed-artifacts
          if-no-files-found: ignore
