name: Deploy Property Check live beta

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/property-check-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: property-check-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build live static site
        run: |
          rm -rf .pages-site
          mkdir -p .pages-site
          python3 site/build-live-site.py site/index.html .pages-site/index.html
          cat site/live-property.parts/*.js.part > .pages-site/live-property.js
          node --check .pages-site/live-property.js
          touch .pages-site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
