name: Deploy Property Check live beta
# Controlled prototype deployment gate: LC-UX-v0.5.0

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/property-check-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: property-check-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build checks-first workspace
        run: |
          python3 site/build-static.py .pages-site
          node --check .pages-site/checks-workspace-v5.js
          node --check .pages-site/checks-workspace-map.js
          node --check .pages-site/checks-workspace-v5-semantics.js
          node --check .pages-site/checks-workspace-v5-shortlist.js
          grep -Fq 'LC-UX-v0.5.0' .pages-site/checks-workspace-v5.js
          grep -Fq 'LC-MAP-v0.2.0' .pages-site/checks-workspace-map.js
          grep -Fq 'LC-WORKSPACE-SEMANTICS-v0.1.1' .pages-site/checks-workspace-v5-semantics.js
          grep -Fq 'LC-WORKSPACE-SHORTLIST-v0.1.0' .pages-site/checks-workspace-v5-shortlist.js
          grep -Fq 'src="./checks-workspace-v5.js"' .pages-site/index.html
          grep -Fq 'src="./checks-workspace-v5-shortlist.js"' .pages-site/index.html
          grep -Fq 'href="./checks-workspace-v5.css"' .pages-site/index.html
          ! grep -Fq 'src="./ux-simplification.js"' .pages-site/index.html
          ! grep -Fq 'src="./decision-cockpit-v4.js"' .pages-site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-site:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use preinstalled Chrome
        run: |
          which google-chrome
          google-chrome --version
          npm init -y
          npm install --no-save playwright-core@1.55.0

      - name: Wait for complete checks-first workspace deployment
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for i in {1..120}; do
            if curl --fail --silent --location "$SITE_URL/checks-workspace-v5.js" | grep -Fq 'LC-UX-v0.5.0' \
              && curl --fail --silent --location "$SITE_URL/checks-workspace-v5-shortlist.js" | grep -Fq 'LC-WORKSPACE-SHORTLIST-v0.1.0'; then
              exit 0
            fi
            sleep 2
          done
          echo "Complete checks-first workspace did not become reachable: $SITE_URL"
          exit 1

      - name: Verify deployed workspace
        env:
          PROPERTY_CHECK_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/deployed-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/workspace-v5-smoke.mjs

      - name: Capture deployed summary views
        env:
          PROPERTY_CHECK_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/deployed-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/workspace-v5-visual.mjs

      - name: Verify deployed v5-owned comparison
        env:
          PROPERTY_CHECK_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/deployed-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/comparison-smoke.mjs

      - name: Verify complete-data preview
        env:
          PROPERTY_CHECK_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/deployed-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/full-preview-smoke.mjs

      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-check-deployed-browser-evidence
          path: site/tests/deployed-artifacts
          if-no-files-found: ignore
