name: Property Check live source smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/property-check-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-check-live-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use preinstalled Chrome
        run: |
          which google-chrome
          google-chrome --version
          npm init -y
          npm install --no-save playwright-core@1.55.0

      - name: Build simplified static site
        run: |
          python3 site/build-static.py .pages-site
          node --check .pages-site/live-property.js
          node --check .pages-site/ux-simplification.js
          node --check .pages-site/full-report-preview.js
          grep -Fq 'LC-UX-v0.1.0' .pages-site/ux-simplification.js
          grep -Fq 'LC-FULL-PREVIEW-v0.1.0' .pages-site/full-report-preview.js
          grep -Fq 'src="./full-report-preview.js"' .pages-site/index.html
          grep -Fq 'href="./full-report-preview.css"' .pages-site/index.html
          ! grep -Fq 'leaflet' .pages-site/index.html

      - name: Start static site
        run: |
          python3 -m http.server 8000 --directory .pages-site > /tmp/property-check-http.log 2>&1 &
          echo $! > /tmp/property-check-http.pid
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/property-check-http.log
          exit 1

      - name: Test live sources and simplified report
        env:
          PROPERTY_CHECK_BASE_URL: http://127.0.0.1:8000/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/live-smoke.mjs

      - name: Test saved-property comparison
        env:
          PROPERTY_CHECK_BASE_URL: http://127.0.0.1:8000/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/comparison-smoke.mjs

      - name: Test full-product preview
        env:
          PROPERTY_CHECK_BASE_URL: http://127.0.0.1:8000/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/full-preview-smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-check-live-browser-evidence
          path: site/tests/artifacts
          if-no-files-found: ignore
