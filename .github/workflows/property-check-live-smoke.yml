name: Property Check live source smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/property-check-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-check-live-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use preinstalled Chrome
        run: |
          which google-chrome
          google-chrome --version
          npm init -y
          npm install --no-save playwright-core@1.55.0

      - name: Build and verify live static site
        run: |
          rm -rf .pages-site
          mkdir -p .pages-site
          {
            cat site/index.parts/part-0[0-4].b64.part
            cat site/index.parts/part-05.fragments/*.b64.part
            cat site/index.parts/part-06.b64.part
          } | tr -d '\n\r' | base64 -d | gunzip > .pages-site/index.html
          cat site/live-property.parts/*.js.part > .pages-site/live-property.js
          python3 site/patch-live-search.py .pages-site/live-property.js
          echo "cc3561dda4bda26473747f7f90a47f6145dd196166b6e8ff9442d0a0ab118faa  .pages-site/index.html" | sha256sum -c -
          echo "2f2f5b3150023412efa8c7b957090700b6d12b74ec81c6b252257a817d19afad  .pages-site/live-property.js" | sha256sum -c -
          node --check .pages-site/live-property.js
          cp site/favicon.svg site/enhancements.js site/enhancements.css .pages-site/
          node --check .pages-site/enhancements.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.pages-site/index.html')
          s = p.read_text(encoding='utf-8')
          head = '''  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynhFClGxaSpasiLaGBmRHKbMZ5V3s0=" crossorigin="">
            <link rel="stylesheet" href="./enhancements.css">'''
          scripts = '''  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
            <script src="./enhancements.js"></script>'''
          s = s.replace('</head>', f'{head}\n</head>', 1)
          s = s.replace('</body>', f'{scripts}\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq '<script src="./live-property.js"></script>' .pages-site/index.html
          grep -Fq 'href="./enhancements.css"' .pages-site/index.html
          grep -Fq 'src="./enhancements.js"' .pages-site/index.html
          grep -Fq 'leaflet@1.9.4' .pages-site/index.html

      - name: Start static site
        run: |
          python3 -m http.server 8000 --directory .pages-site > /tmp/property-check-http.log 2>&1 &
          echo $! > /tmp/property-check-http.pid
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/property-check-http.log
          exit 1

      - name: Test live Queensland and Brisbane sources in browser
        env:
          PROPERTY_CHECK_BASE_URL: http://127.0.0.1:8000/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/live-smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-check-live-browser-evidence
          path: site/tests/artifacts
          if-no-files-found: ignore
