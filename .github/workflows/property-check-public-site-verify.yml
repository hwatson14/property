name: Verify deployed Property Check site

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/property-check-public-site-verify.yml"
      - "site/tests/live-smoke.mjs"
      - "site/tests/comparison-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-check-public-site-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-site:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'verify-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use preinstalled Chrome
        run: |
          which google-chrome
          google-chrome --version
          npm init -y
          npm install --no-save playwright-core@1.55.0

      - name: Wait for simplified UX to be served
        run: |
          for i in {1..120}; do
            if curl --fail --silent --location --max-time 15 \
              https://hwatson14.github.io/property/ux-simplification.js \
              | grep -Fq 'LC-UX-v0.1.0'; then
              echo "Simplified UX is deployed."
              exit 0
            fi
            sleep 2
          done
          echo "Simplified UX did not become available."
          exit 1

      - name: Verify public live report
        env:
          PROPERTY_CHECK_BASE_URL: https://hwatson14.github.io/property/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/public-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/live-smoke.mjs

      - name: Verify public comparison
        env:
          PROPERTY_CHECK_BASE_URL: https://hwatson14.github.io/property/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/public-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/comparison-smoke.mjs

      - name: Upload public-site browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-check-public-site-evidence
          path: site/tests/public-artifacts
          if-no-files-found: ignore
