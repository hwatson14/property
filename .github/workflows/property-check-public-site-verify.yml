name: Verify deployed Property Check site
# Controlled beta gate: LC-UX-v0.5.0

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/property-check-public-site-verify.yml"
      - "site/tests/workspace-v5-smoke.mjs"
      - "site/tests/workspace-v5-visual.mjs"
      - "site/tests/comparison-smoke.mjs"
      - "site/tests/full-preview-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-check-public-site-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-site:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'verify-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use preinstalled Chrome
        run: |
          which google-chrome
          google-chrome --version
          npm init -y
          npm install --no-save playwright-core@1.55.0

      - name: Wait for checks-first workspace to be served
        run: |
          for i in {1..150}; do
            if curl --fail --silent --location --max-time 15 \
              https://hwatson14.github.io/property/checks-workspace-v5.js \
              | grep -Fq 'LC-UX-v0.5.0'; then
              echo "LemonCheck checks-first workspace v5 is deployed."
              exit 0
            fi
            sleep 2
          done
          echo "LemonCheck checks-first workspace v5 did not become available."
          exit 1

      - name: Verify public checks-first workspace
        env:
          PROPERTY_CHECK_BASE_URL: https://hwatson14.github.io/property/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/public-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/workspace-v5-smoke.mjs

      - name: Capture public summary views
        env:
          PROPERTY_CHECK_BASE_URL: https://hwatson14.github.io/property/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/public-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/workspace-v5-visual.mjs

      - name: Verify public comparison
        env:
          PROPERTY_CHECK_BASE_URL: https://hwatson14.github.io/property/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/public-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/comparison-smoke.mjs

      - name: Verify public full report preview
        env:
          PROPERTY_CHECK_BASE_URL: https://hwatson14.github.io/property/
          PROPERTY_CHECK_ARTIFACT_DIR: site/tests/public-artifacts
          CHROME_PATH: /usr/bin/google-chrome
        run: node site/tests/full-preview-smoke.mjs

      - name: Upload public-site browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-check-public-site-evidence
          path: site/tests/public-artifacts
          if-no-files-found: ignore
